services:
  openspec-detect-agent:
    command:
    - /usr/local/bin/python
    - /preflight/probe.py
    volumes:
    - type: bind
      source: ./compose/preflight/probe.py
      target: /preflight/probe.py
      read_only: true
      bind:
        create_host_path: false
