    user: 1007:1007
    working_dir: /workspace
    read_only: true
    restart: 'no'
    command:
    - sleep
    - infinity
    cpus: 4.0
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 512
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
