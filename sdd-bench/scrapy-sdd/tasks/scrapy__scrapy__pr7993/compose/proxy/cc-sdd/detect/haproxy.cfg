# Scrapy SDD benchmark: provider-only TLS egress for DeepSeek.
#
# HAProxy 3.2.23 passes encrypted TCP bytes through unchanged. It does not
# terminate TLS, inspect HTTP, or receive the bearer token in plaintext.
# Each experiment must run its own proxy container and private internal network
# while mounting these identical bytes read-only.
#
# The Agent-side network must map api.deepseek.com to its own proxy container.
# Only the proxy joins an uplink network. At each fresh proxy start, the trusted
# Docker/host resolver resolves the one fixed backend hostname.

global
    log stdout format raw local0
    maxconn 32
    nbthread 1

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 50m
    timeout server 50m
    timeout client-fin 5s
    timeout server-fin 5s
    timeout tunnel 50m

frontend deepseek_tls_in
    bind :443
    default_backend deepseek_tls_out

backend deepseek_tls_out
    # Fail closed: if the trusted resolver cannot resolve the fixed provider
    # hostname at proxy startup, HAProxy must refuse to start.
    server deepseek api.deepseek.com:443 check inter 30s fall 3 rise 2 init-addr libc
